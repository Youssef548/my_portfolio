name: Deploy

on:
  push:
    branches: [temp-branch]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-portfolio
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
      image_full: ${{ steps.vars.outputs.image_full }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_full=ghcr.io/${OWNER}/my-portfolio" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image_full }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_FULL: ${{ needs.build.outputs.image_full }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_FULL,IMAGE_TAG
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/my_portfolio

            echo "==> Pulling latest config..."
            git fetch origin temp-branch
            git reset --hard origin/temp-branch

            echo "==> Pulling image ${IMAGE_FULL}:${IMAGE_TAG}..."
            docker pull "${IMAGE_FULL}:${IMAGE_TAG}"

            echo "==> Updating service..."
            IMAGE_TAG="${IMAGE_TAG}" docker compose up -d app --remove-orphans

            echo "==> Verifying service is running..."
            sleep 5
            if docker compose ps app --format json | grep -q '"running"'; then
              echo "  app is running."
            else
              echo "  ERROR: app is not running!"
              docker compose logs --tail=30 app
              exit 1
            fi

            echo "==> Pruning old images..."
            docker image prune -f --filter "until=168h"

            echo "==> Deploy complete."
